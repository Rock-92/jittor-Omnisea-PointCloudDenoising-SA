train_transform:
  augments:
    - __target__: sample
      num_samples: 16384
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020
      noise_type: laplace

validate_transform:
  augments:
    - __target__: sample
      num_samples: 16384
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020
      noise_type: laplace

predict_transform: {}
