loss:
  displacement_loss: 0.0
  normalized_surface_loss: 0.0
  nearest_clean_loss: 0.0
  clean_coverage_loss: 0.0
  patch_chamfer_loss: 1.0
  nearest_surface_loss: 1.0
  candidate_surface_loss: 0.15
  candidate_normal_loss: 0.03
  candidate_diversity_loss: 0.02
  candidate_confidence_loss: 0.08
  candidate_best_score: 0.0
  candidate_best_plane: 0.0
  candidate_best_point: 0.0
  candidate_mean_entropy: 0.0
  candidate_confidence_displacement_loss: 0.0
  region_context_gate: 0.0
  region_crease_mean: 0.0
  region_prior_delta: 0.0
  train_length_ratio: 0.0
  train_cosine: 0.0
  train_negative_cos_rate: 0.0
  train_pred_len: 0.0
  train_target_len: 0.0

optimizer:
  __target__: adam
  lr: 0.000003

scheduler:
  __target__: reduce_on_plateau
  monitor: final_score
  mode: max
  factor: 0.8
  patience: 10
  min_lr: 0.0000003

trainer:
  epochs: 30
