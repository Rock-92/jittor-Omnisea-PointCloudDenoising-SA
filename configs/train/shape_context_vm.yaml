loss:
  nearest_clean_loss: 0.0
  clean_coverage_loss: 0.0
  patch_chamfer_loss: 1.0
  nearest_surface_loss: 1.0
  surface_coherence_loss: 0.5
  surface_outlier_loss: 0.5
  region_context_gate: 0.0
  region_crease_mean: 0.0
  region_prior_delta: 0.0

optimizer:
  __target__: adam
  lr: 0.000003

scheduler:
  __target__: reduce_on_plateau
  monitor: final_score
  mode: max
  factor: 0.8
  patience: 10
  min_lr: 0.0000003

trainer:
  epochs: 30
