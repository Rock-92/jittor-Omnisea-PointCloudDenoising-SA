loss:
  candidate_chamfer_loss: 1.0
  candidate_surface_loss: 1.0
  candidate_cover_loss: 1.0
  candidate_diversity_loss: 0.1
  candidate_conf_loss: 0.5
  candidate_enable_loss: 2.0

optimizer:
  __target__: adam
  lr: 0.000003

scheduler:
  __target__: reduce_on_plateau
  monitor: final_score
  mode: max
  factor: 0.8
  patience: 10
  min_lr: 0.0000003

trainer:
  epochs: 30
