loss:
  displacement_loss: 1.0
  patch_chamfer_loss: 1.0
  hard_normal_loss: 1.0
  length_projection_loss: 1.0
  sigma_loss: 0.01

optimizer:
  __target__: adam
  lr: 0.000003

scheduler:
  __target__: reduce_on_plateau
  monitor: final_score
  mode: max
  factor: 0.8
  patience: 10
  min_lr: 0.0000003

trainer:
  epochs: 100
