loss:
  displacement_loss: 0.9
  edge_aux_displacement_loss: 0.2
  normalized_surface_loss: 0.1
  edge_geom_cls_loss: 0.05
  edge_geom_acc: 0.0
  edge_gate_match_loss: 0.02

optimizer:
  __target__: adam
  lr: 0.000003

scheduler:
  __target__: reduce_on_plateau
  monitor: final_score
  mode: max
  factor: 0.8
  patience: 10
  min_lr: 0.0000003

trainer:
  epochs: 100
  edge_geom_freeze_epochs: 20
