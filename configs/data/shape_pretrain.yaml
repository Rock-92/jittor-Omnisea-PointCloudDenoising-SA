data_name: &data_name models/model_normalized.obj
loader: &loader obj

train_dataset:
  shuffle: true
  batch_size: 4
  num_workers: 8
  datapath:
    input_dataset_dir: ./dataset_clean
    use_prob: false
    loader: *loader
    data_name: *data_name
    ignore_check: false
    data_path:
      shapenet:
        - [./datalist/train.txt, 1.0]

validate_dataset:
  shuffle: false
  batch_size: 2
  num_workers: 8
  datapath:
    input_dataset_dir: ./dataset_clean
    use_prob: false
    loader: *loader
    data_name: *data_name
    ignore_check: false
    data_path:
      shapenet:
        - [./datalist/validate.txt, 1.0]
