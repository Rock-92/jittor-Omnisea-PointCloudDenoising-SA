__target__: MaskedShapePretrainModule

region_count: 192
points_per_region: 64
fps_candidate_count: 8192
token_dim: 128
region_knn: [8, 16]
num_blocks: 4
relative_bias_dim: 32
max_reconstruction_radius: 0.08

mask_ratio_min: 0.40
mask_ratio_max: 0.70
spatial_mask_fraction: 0.70

# Student input and region layout are built from noisy complete shapes;
# masked reconstruction targets remain clean local geometry.
noise_std_min: 0.005
noise_std_max: 0.020
noise_type: laplace

reconstruction_scale: 0.01
fscore_threshold: 0.01

# Pretraining is optimized through a single weighted `pretrain_loss`; the
# component metrics are logged separately.
# Noisy-student / clean-teacher pretraining:
# - reconstruction keeps local clean geometry visible;
# - token distillation, normal and crease heads teach clean surface priors.
masked_reconstruction_weight: 0.75
all_reconstruction_weight: 0.20
center_displacement_weight: 0.80
geometry_weight: 0.30
token_distill_weight: 0.70
normal_weight: 0.70
crease_weight: 0.30
consistency_weight: 0.10
center_displacement_scale: 0.02
