__target__: VelocityModule

attention_knn: [8, 16, 32]
input_dim: 3
input_expand_dim: 128
feat_embedding_dim: 256
attention_blocks: 4
attention_weight_init: [1.0, 0.6, 0.3, 0.2]
relative_position_bias_hidden_dim: 64
attention_ffn_hidden_dim: 512
global_token_blocks: 4
global_token_ffn_hidden_dim: 512
global_attn_bias_init: 0.0
legacy_graph_updates: true

decoder_hidden_dims: [128, 64]

dsm_sigma: 0.01
num_train_points: 256
use_edm: false
use_edgeconv_branch: false

predict_rounds: 1
denoise_num_steps: 1
predict_patch_size: 1000
predict_seed_k: 6
predict_seed_interval: 200
predict_seed_k_alpha: 1
patch_fusion_mode: distance_weighted
patch_fusion_tau: 2.0
