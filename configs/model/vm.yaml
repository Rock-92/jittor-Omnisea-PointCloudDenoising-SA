__target__: VelocityModule

# Encoder
attention_knn: [8, 16, 32]
input_dim: 3
input_expand_dim: 128
feat_embedding_dim: 256
attention_blocks: 4
attention_weight_init: [1.0, 0.6, 0.3]
relative_position_bias_hidden_dim: 64

# Decoder
decoder_hidden_dim: 64

# Loss
dsm_sigma: 0.01
num_train_points: 256

# Patch-based prediction
predict_rounds: 1
denoise_num_steps: 1
predict_patch_size: 1000
# Kept for compatibility; interval-based inference uses predict_seed_interval.
predict_seed_k: 6
predict_seed_interval: 200
predict_seed_k_alpha: 1
