__target__: VelocityModule

# Encoder
attention_knn: [8, 16, 32]
input_dim: 3
input_expand_dim: 128
feat_embedding_dim: 256
attention_blocks: 4
attention_weight_init: [1.0, 0.6, 0.3, 0.2]
attention_ffn_hidden_dim: 512
global_token_blocks: 4
global_token_ffn_hidden_dim: 512
use_edgeconv_branch: false
edgeconv_branch_k: 16
edgeconv_branch_dim: 128

# Decoder
decoder_hidden_dims: [128, 64]

# Loss
dsm_sigma: 0.01
num_train_points: 256
use_edm: true
sigma_data: 0.10
edm_default_sigma: 0.01
edm_loss_weighting: true
noise_embedding_dim: 256
use_patch_scale_condition: true
patch_scale_eps: 0.0001
use_sigma_head: false
sigma_head_hidden_dim: 128
use_hard_aware_loss: false
hard_relative_sigma_ref: 0.18
hard_weight_scale: 2.0
hard_weight_max: 3.0
use_geometry_hard_weight: false
hard_geometry_k: 24
hard_geometry_top_fraction: 0.25
hard_geometry_ref: 0.45
hard_geometry_weight_scale: 1.5
use_length_projection_loss: false
length_projection_over_weight: 0.25
hard_chamfer_weight: 0.08
hard_normal_weight: 0.02
edm_sampler: heun
edm_sigma_min: 0.0001
edm_sigma_max: 0.025
edm_inference_sigmas: [0.020, 0.010, 0.005, 0.0]

# Patch-based prediction
predict_rounds: 1
denoise_num_steps: 1
predict_patch_size: 1000
# FPS-based inference uses predict_seed_k. predict_seed_interval is kept for compatibility.
predict_seed_k: 6
predict_seed_interval: 200
predict_seed_k_alpha: 1
patch_fusion_mode: distance_weighted
patch_fusion_tau: 2.0
