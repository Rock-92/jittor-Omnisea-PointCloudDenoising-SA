__target__: EdgeConv_Baseline

# Official EdgeConv baseline
frame_knn: 16
input_dim: 3
feat_embedding_dim: 256
decoder_hidden_dim: 64
decoder_dropout: 0.1
num_train_points: 128

# Loss
dsm_sigma: 0.01
use_edm: true
sigma_data: 0.10
edm_default_sigma: 0.01
edm_loss_weighting: true
noise_embedding_dim: 256
use_patch_scale_condition: true
patch_scale_eps: 0.0001
edm_sampler: heun
edm_sigma_min: 0.0001
edm_inference_sigmas: [0.020, 0.010, 0.005, 0.0]

# Patch-based prediction
predict_rounds: 1
predict_patch_size: 1000
predict_seed_k: 6
predict_seed_interval: 200
predict_seed_k_alpha: 1
