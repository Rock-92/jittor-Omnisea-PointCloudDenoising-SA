__target__: GlobalTokenSSLModule

attention_knn: [8, 16, 32]
input_dim: 3
input_expand_dim: 128
feat_embedding_dim: 256
attention_blocks: 4
attention_weight_init: [1.0, 0.6, 0.3, 0.2]
relative_position_bias_hidden_dim: 64
attention_ffn_hidden_dim: 512
global_token_blocks: 4
global_token_ffn_hidden_dim: 512
global_attn_bias_init: 0.0

patch_size: 1000

# Lightweight Point-MAE style pretraining.
# A random subset of clean patch points is hidden, the global token encoder sees
# only visible points, and mae_decoder reconstructs the masked point set.
mask_ratio: 0.6
mae_visible_points: 400
mae_mask_points: 600
mae_decoder_hidden_dim: 512
mae_noise_std: 0.005
mae_jitter_std: 0.001
mae_jitter_clip: 0.003
