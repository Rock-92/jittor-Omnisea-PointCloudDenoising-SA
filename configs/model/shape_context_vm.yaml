__target__: ShapeContextVelocityModule

# Pure VM patch encoder. EDM/noise embedding are intentionally disabled.
attention_knn: [8, 16, 32]
input_dim: 3
input_expand_dim: 128
feat_embedding_dim: 256
attention_blocks: 4
attention_weight_init: [1.0, 0.6, 0.3, 0.2]
relative_position_bias_hidden_dim: 64
attention_ffn_hidden_dim: 512
global_token_blocks: 4
global_token_ffn_hidden_dim: 512
global_attn_bias_init: 0.0
legacy_graph_updates: true
decoder_hidden_dims: [128, 64]

dsm_sigma: 0.01
num_train_points: 256
use_edm: false
use_edgeconv_branch: false
use_hard_aware_loss: false
use_length_projection_loss: false
use_surface_aligned_loss: true
surface_normal_k: 6
use_surface_snap_loss: true
surface_snap_tau: 0.001
surface_snap_weight: 3.0
use_surface_coherence_loss: false
use_surface_distribution_loss: false
surface_distribution_repulsion_weight: 0.2
surface_coherence_k: 8
surface_coherence_cos: 0.5
surface_coherence_center_cos: 0.5
surface_outlier_margin: 0.001
use_surface_branch_loss: false
surface_branch_tau: 0.001
surface_branch_min_valid: 0.5
surface_branch_snap_k: 16
nearest_surface_branch_k: 16
nearest_surface_branch_margin: 0.04
use_branch_coverage_loss: true
branch_coverage_tau: 0.001
branch_coverage_tangent_weight: 0.1
branch_coverage_exclusive_ratio: 2.0
use_surface_thinness_loss: false
use_surface_halo_loss: false
surface_branch_separation_k: 8
surface_branch_separation_margin: 0.8

# Complete-shape processor. Only region tokens condition the denoiser; the
# processor's shape-global output is not computed or injected.
shape_pretrained_ckpt: outputs/shape_pretrain/checkpoints/processor_best.pkl
shape_region_count: 256
shape_points_per_region: 64
shape_region_fps_candidates: 8192
shape_token_dim: 128
shape_region_knn: [8, 16]
shape_num_blocks: 4
shape_relative_bias_dim: 32
shape_max_reconstruction_radius: 0.08
shape_context_knn: 4
shape_surface_prior_scale: 0.1

predict_rounds: 1
denoise_num_steps: 1
predict_patch_size: 1000
predict_seed_k: 6
predict_seed_interval: 200
predict_seed_k_alpha: 1
patch_fusion_mode: distance_weighted
patch_fusion_tau: 2.0
